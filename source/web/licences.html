<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rature</title>
<link rel="stylesheet" href="/commun.css">
<style>
main { max-width: 820px; margin: 0 auto; padding: 36px 24px 80px; }
h1 { font-size: 28px; font-weight: 680; margin-bottom: 8px; }
.intro { color: var(--muted); margin: 0 0 24px; max-width: 620px; }
.carte { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
details { border-bottom: 1px solid var(--line); }
details:last-child { border-bottom: 0; }
summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 1fr auto 16px; gap: 14px; align-items: center; padding: 13px 16px; }
summary::-webkit-details-marker { display: none; }
summary:hover { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
summary b { font-weight: 600; }
summary .v { font: 12px var(--mono); color: var(--faint); margin-left: 6px; }
summary .role { display: block; color: var(--muted); font-size: 13px; margin-top: 1px; }
.lic { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 5px; background: var(--surface-2); color: var(--muted); white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.fleche { color: var(--faint); transition: transform .15s; }
details[open] .fleche { transform: rotate(90deg); }
.texte { padding: 0 16px 16px; }
.texte a { color: var(--accent); font-size: 13px; }
pre { margin: 10px 0 0; max-height: 360px; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 9px;
  padding: 12px 14px; font: 11.5px/1.5 var(--mono); color: var(--muted); white-space: pre-wrap; }
.note { color: var(--faint); font-size: 12.5px; margin-top: 18px; }
</style>
</head>
<body>
<header class="appbar">
  <a class="logo" href="/"></a>
  <span class="sep"></span>
  <a class="btn fantome petit" href="/reglages" data-t="lic.retour"></a>
</header>
<main>
  <h1 data-t="lic.titre"></h1>
  <p class="intro" data-t="lic.intro"></p>
  <div class="carte" id="liste"><div style="padding:20px;color:var(--faint)" data-t="lic.chargement"></div></div>
  <p class="note" data-t="lic.note"></p>
</main>
<script src="/langue.js"></script>
<script src="/i18n.js"></script>
<script src="/commun.js"></script>
<script>
$('.logo').innerHTML = LOGO + 'Rature';
api('/api/licences').then(liste => {
  $('#liste').innerHTML = liste.map(c => {
    const role = typeof c.role === 'object' ? (c.role[LANGUE_UI] || c.role.fr) : c.role;
    return `<details>
    <summary><div><b>${esc(c.nom)}</b><span class="v">${esc(c.version)}</span><span class="role">${esc(role)}</span></div>
      <span class="lic" title="${esc(c.licence)}">${esc(c.licence)}</span><span class="fleche">›</span></summary>
    <div class="texte"><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.url)}</a><pre>${esc(c.texte)}</pre></div>
  </details>`;
  }).join('');
});
</script>
</body>
</html>
